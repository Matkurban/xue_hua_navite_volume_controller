name: xue_hua_navite_volume_controller
description: "Cross-platform system & application audio volume controller plugin for Flutter (Android, iOS, macOS, Windows, Linux, Web) with multi-stream control, mute, ringer mode, hardware key interception, and device routing."
version: 1.0.0
homepage: https://github.com/Matkurban/xue_hua_navite_volume_controller
repository: https://github.com/Matkurban/xue_hua_navite_volume_controller
issue_tracker: https://github.com/Matkurban/xue_hua_navite_volume_controller/issues
documentation: https://github.com/Matkurban/xue_hua_navite_volume_controller#readme

topics:
  - volume
  - audio
  - sound
  - media
  - hardware-buttons

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.2
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_navite_volume_controller
        pluginClass: XueHuaNaviteVolumeControllerPlugin
      ios:
        pluginClass: XueHuaNaviteVolumeControllerPlugin
      linux:
        pluginClass: XueHuaNaviteVolumeControllerPlugin
      macos:
        pluginClass: XueHuaNaviteVolumeControllerPlugin
      windows:
        pluginClass: XueHuaNaviteVolumeControllerPluginCApi
      web:
        pluginClass: XueHuaNaviteVolumeControllerWeb
        fileName: xue_hua_navite_volume_controller_web.dart
